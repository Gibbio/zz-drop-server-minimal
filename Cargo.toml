[package]
name = "zz-drop-server-minimal"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Minimal reference implementation of the zz-drop API v1"
repository = "https://github.com/zz-drop/zz-drop-server-minimal"
publish = false

[[bin]]
name = "zz-drop-server-minimal"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
zz-drop-core = { path = "../zz-drop-core" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Auth crypto. Versions aligned with zz-drop-core's `argon2 = "0.5"`
# so the digest 0.10 ecosystem is single-versioned in the dep tree.
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base32 = "0.5"
getrandom = "0.2"
subtle = "2"
chacha20poly1305 = "0.10"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.dist]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
